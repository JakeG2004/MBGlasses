[package]
name = "band-lighthshow"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
ftdi-nusb = { version = "0.3.0", features = ["tokio"] }
nusb = "0.2.7"
ratatui = "0.30.2"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "time"] }
