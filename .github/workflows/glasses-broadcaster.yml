name: Glasses broadcaster CI

on:
  push:
    branches:
      - "**"
    paths:
      - "glasses-broadcaster/**"
      - ".github/workflows/glasses-broadcaster.yml"
      - ".github/workflows/glasses-broadcaster-release.yml"
  pull_request:
    paths:
      - "glasses-broadcaster/**"
      - ".github/workflows/glasses-broadcaster.yml"
      - ".github/workflows/glasses-broadcaster-release.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      rust_toolchain:
        type: string
        default: stable
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-quality
  cancel-in-progress: true

defaults:
  run:
    working-directory: glasses-broadcaster

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: ${{ inputs.rust_toolchain || 'stable' }}

jobs:
  check:
    name: Build, test, and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config libudev-dev

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --component rustfmt --no-self-update

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Clippy warnings
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-features

      - name: Build release application
        run: cargo build --locked --release --all-features

      - name: Test release contracts
        run: python3 -m unittest discover -s packaging/release -p 'test_*.py' -v