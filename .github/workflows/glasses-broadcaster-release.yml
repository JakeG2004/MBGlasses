name: Glasses broadcaster release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: glasses-broadcaster

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.contract.outputs.version }}
      linux: ${{ steps.contract.outputs.linux }}
      macos: ${{ steps.contract.outputs.macos }}
      windows: ${{ steps.contract.outputs.windows }}
      macos_sign: ${{ steps.contract.outputs.macos_sign }}
      rust: ${{ steps.contract.outputs.rust }}
      python: ${{ steps.contract.outputs.python }}
      wix: ${{ steps.contract.outputs.wix }}
      dotnet: ${{ steps.contract.outputs.dotnet }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: tools
        name: Read pinned Python version
        run: python3 -c 'import json; print("python=" + json.load(open("packaging/targets.json"))["tools"]["python"])' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ steps.tools.outputs.python }}
      - id: contract
        name: Validate stable tag, source, versions, and matrix
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          MACOS_SIGN: ${{ vars.MACOS_SIGN || '0' }}
        run: python3 packaging/release/release.py preflight --tag "$RELEASE_TAG" --macos-sign "$MACOS_SIGN" --github-output "$GITHUB_OUTPUT"

  quality:
    needs: preflight
    uses: ./.github/workflows/glasses-broadcaster.yml
    with:
      rust_toolchain: ${{ needs.preflight.outputs.rust }}

  linux:
    name: ${{ matrix.id }}
    needs: [preflight, quality]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.linux) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ needs.preflight.outputs.python }}
      - name: Native build, package, install, and removal checks
        env:
          TARGET_ID: ${{ matrix.id }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: python3 packaging/release/release.py build-linux --target "$TARGET_ID" --version "$VERSION" --output target/release-packages
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-${{ matrix.id }}
          path: |
            glasses-broadcaster/target/release-packages/*.deb
            glasses-broadcaster/target/release-packages/*.rpm
            glasses-broadcaster/target/release-packages/*.deb.json
            glasses-broadcaster/target/release-packages/*.rpm.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  macos:
    name: Apple Silicon macOS installer
    needs: [preflight, quality]
    runs-on: ${{ fromJSON(needs.preflight.outputs.macos).runner }}
    environment: release-signing
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      MACOS_ID: ${{ fromJSON(needs.preflight.outputs.macos).id }}
      MACOS_SIGN: ${{ needs.preflight.outputs.macos_sign }}
      MACOS_MIN_VERSION: ${{ fromJSON(needs.preflight.outputs.macos).minimum_os }}
      MACOS_VERIFY_INSTALL: '1'
      RUSTUP_TOOLCHAIN: ${{ needs.preflight.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ needs.preflight.outputs.python }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action source
        with:
          toolchain: ${{ needs.preflight.outputs.rust }}
      - name: Build and install-check unsigned package
        if: needs.preflight.outputs.macos_sign == '0'
        run: bash packaging/macos/build.sh "$VERSION" target/release-packages
      - name: Build, sign, notarize, and install-check package
        if: needs.preflight.outputs.macos_sign == '1'
        env:
          MACOS_APPLICATION_P12_BASE64: ${{ secrets.MACOS_APPLICATION_P12_BASE64 }}
          MACOS_APPLICATION_P12_PASSWORD: ${{ secrets.MACOS_APPLICATION_P12_PASSWORD }}
          MACOS_INSTALLER_P12_BASE64: ${{ secrets.MACOS_INSTALLER_P12_BASE64 }}
          MACOS_INSTALLER_P12_PASSWORD: ${{ secrets.MACOS_INSTALLER_P12_PASSWORD }}
          MACOS_APPLICATION_IDENTITY: ${{ secrets.MACOS_APPLICATION_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash packaging/macos/build.sh "$VERSION" target/release-packages
      - name: Record verified final package
        run: |
          label=unsigned
          if [ "$MACOS_SIGN" = 1 ]; then label=signed; fi
          python3 packaging/release/release.py attest --target "$MACOS_ID" --version "$VERSION" --package "target/release-packages/glasses-broadcaster-$VERSION-$MACOS_ID-$label.pkg" --proof target/release-packages/macos-verification.json --output target/release-artifact --macos-sign "$MACOS_SIGN"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-${{ fromJSON(needs.preflight.outputs.macos).id }}
          path: |
            glasses-broadcaster/target/release-artifact/*.pkg
            glasses-broadcaster/target/release-artifact/*.pkg.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  windows:
    name: Unsigned Windows x86-64 installer
    needs: [preflight, quality]
    runs-on: ${{ fromJSON(needs.preflight.outputs.windows).runner }}
    permissions:
      contents: read
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      WINDOWS_ID: ${{ fromJSON(needs.preflight.outputs.windows).id }}
      OUT: ${{ github.workspace }}/glasses-broadcaster/target/windows-package
      RUSTUP_TOOLCHAIN: ${{ needs.preflight.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ needs.preflight.outputs.python }}
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ needs.preflight.outputs.dotnet }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action source
        with:
          toolchain: ${{ needs.preflight.outputs.rust }}
      - name: Build static-runtime executable and run tests
        run: ./packaging/windows/build.ps1 -Stage Build -Version $env:VERSION -OutputDirectory $env:OUT
      - name: Build unsigned MSI
        env:
          WIX_VERSION: ${{ needs.preflight.outputs.wix }}
        run: ./packaging/windows/build.ps1 -Stage Package -Version $env:VERSION -OutputDirectory $env:OUT -WixVersion $env:WIX_VERSION
      - name: Obtain prior published MSI when available
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: python packaging/release/release.py previous-msi --version $env:VERSION --output "$env:OUT/previous" --github-output $env:GITHUB_OUTPUT
      - name: Verify installation, shortcuts, upgrade, and removal
        env:
          PREVIOUS_MSI: ${{ steps.previous.outputs.path }}
        run: ./packaging/windows/build.ps1 -Stage Verify -Version $env:VERSION -OutputDirectory $env:OUT -PreviousMsi $env:PREVIOUS_MSI
      - name: Record verified final MSI
        run: python packaging/release/release.py attest --target $env:WINDOWS_ID --version $env:VERSION --package "$env:OUT/msi/glasses-broadcaster-$env:VERSION-$env:WINDOWS_ID.msi" --proof "$env:OUT/windows-verification.json" --output target/release-artifact
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-${{ fromJSON(needs.preflight.outputs.windows).id }}
          path: |
            glasses-broadcaster/target/release-artifact/*.msi
            glasses-broadcaster/target/release-artifact/*.msi.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    name: Publish only a complete verified release
    needs: [preflight, quality, linux, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ needs.preflight.outputs.python }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: native-*
          path: glasses-broadcaster/target/downloaded
      - name: Verify completeness, checksums, draft uploads, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          MACOS_SIGN: ${{ needs.preflight.outputs.macos_sign }}
        run: python3 packaging/release/release.py publish --tag "$RELEASE_TAG" --artifacts target/downloaded --output target/release-index --macos-sign "$MACOS_SIGN"